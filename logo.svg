<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="starFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A8FF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="softBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="512" height="512" fill="#050507"/>

  <!-- glow behind main star -->
  <circle cx="256" cy="256" r="170" fill="url(#glow)"/>

  <!-- small scattered 4-point sparkles, same shape, tiny scale -->
  <g fill="#8B5CF6" opacity="0.55">
    <path transform="translate(95,110) scale(0.35)" d="M12 0 L14.2 9.8 L24 12 L14.2 14.2 L12 24 L9.8 14.2 L0 12 L9.8 9.8 Z"/>
    <path transform="translate(410,90) scale(0.28)" d="M12 0 L14.2 9.8 L24 12 L14.2 14.2 L12 24 L9.8 14.2 L0 12 L9.8 9.8 Z"/>
    <path transform="translate(70,370) scale(0.3)" d="M12 0 L14.2 9.8 L24 12 L14.2 14.2 L12 24 L9.8 14.2 L0 12 L9.8 9.8 Z"/>
    <path transform="translate(430,380) scale(0.4)" d="M12 0 L14.2 9.8 L24 12 L14.2 14.2 L12 24 L9.8 14.2 L0 12 L9.8 9.8 Z"/>
    <path transform="translate(150,440) scale(0.25)" d="M12 0 L14.2 9.8 L24 12 L14.2 14.2 L12 24 L9.8 14.2 L0 12 L9.8 9.8 Z"/>
    <path transform="translate(390,440) scale(0.3)" d="M12 0 L14.2 9.8 L24 12 L14.2 14.2 L12 24 L9.8 14.2 L0 12 L9.8 9.8 Z"/>
  </g>

  <!-- soft bloom behind main sparkle -->
  <path
    transform="translate(146,146) scale(9.17)"
    d="M12 0 L14.2 9.8 L24 12 L14.2 14.2 L12 24 L9.8 14.2 L0 12 L9.8 9.8 Z"
    fill="#8B5CF6" opacity="0.4" filter="url(#softBlur)"
  />

  <!-- main 4-point sparkle -->
  <path
    transform="translate(146,146) scale(9.17)"
    d="M12 0 L14.2 9.8 L24 12 L14.2 14.2 L12 24 L9.8 14.2 L0 12 L9.8 9.8 Z"
    fill="url(#starFill)"
  />
</svg>
